<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - SwachhSaarthi</title>
  <link rel="stylesheet" href="./css/global.css">
  <style>
    .auth-container {
      max-width: 400px;
      margin: 4rem auto;
      background: var(--bg-white);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border-color);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text-muted);
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      margin-bottom: -2px;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
    }
    .w-full {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="logo">♻️ SwachhSaarthi</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-container">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login">Login</div>
        <div class="auth-tab" id="tab-signup">Sign Up</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="login-btn">Login</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form">
        <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signup-name" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signup-email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="signup-phone" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signup-password" class="form-control" required minlength="6">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="signup-role" class="form-control" required>
            <option value="Citizen">Citizen</option>
            <option value="Worker">Worker</option>
          </select>
        </div>
        <div class="form-group">
          <label>Area / Ward</label>
          <input type="text" id="signup-area" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-full" id="signup-btn">Sign Up</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/utils.js"></script>
  <script type="module" src="./js/auth.js"></script>
  <script>
    // Tab switching
    const tabLogin = document.getElementById('tab-login');
    const tabSignup = document.getElementById('tab-signup');
    const formLogin = document.getElementById('login-form');
    const formSignup = document.getElementById('signup-form');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabSignup.classList.remove('active');
      formLogin.classList.add('active');
      formSignup.classList.remove('active');
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('active');
      tabLogin.classList.remove('active');
      formSignup.classList.add('active');
      formLogin.classList.remove('active');
    });
  </script>
</body>
</html>
