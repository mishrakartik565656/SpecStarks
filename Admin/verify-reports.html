<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Reports - Admin - SwachhSaarthi</title>
  <link rel="stylesheet" href="../css/global.css">
  <!-- Leaflet Maps CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    .report-card {
      background: var(--bg-white);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    .report-content {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .report-image {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: var(--radius-md);
    }
    .report-details {
      flex: 1;
      min-width: 250px;
    }
    .report-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      background: #E5E7EB;
      color: #374151;
    }
    .badge-submitted { background: #FEF3C7; color: #92400E; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="dashboard.html" class="logo">♻️ SwachhSaarthi <span style="font-size: 1rem; color: var(--text-muted);">| Admin</span></a>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="verify-reports.html" style="color: var(--primary);">Verify Reports</a>
        <a href="verify-cleanup.html">Verify Cleanups</a>
        <a href="analytics.html">Analytics</a>
        <a href="#" class="logout-btn btn btn-outline" style="padding: 0.5rem 1rem;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <h2 class="section-title">Pending Reports</h2>
    <div id="reports-container">
      <p>Loading reports...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module">
    import { supabaseClient } from '../js/supabaseClient.js';
    import { checkSession } from '../js/auth.js';

    let currentUser = null;
    let workers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkSession(['Admin']);
      if (!auth) return;
      currentUser = auth.session.user;

      await fetchWorkers();
      await fetchPendingReports();
    });

    async function fetchWorkers() {
      const { data, error } = await supabaseClient
        .from('profiles')
        .select('id, full_name')
        .eq('role', 'Worker');
      if (!error) workers = data;
    }

    async function fetchPendingReports() {
      const { data, error } = await supabaseClient
        .from('reports')
        .select('*, profiles!citizen_id(full_name, phone)')
        .eq('status', 'Submitted')
        .order('created_at', { ascending: false });

      const container = document.getElementById('reports-container');
      container.innerHTML = '';

      if (error) {
        showToast('Error fetching reports', 'error');
        return;
      }

      if (data.length === 0) {
        container.innerHTML = '<p class="text-center">No pending reports to verify.</p>';
        return;
      }

      for (const report of data) {
        const date = new Date(report.created_at).toLocaleString();
        
        let workerOptions = '<option value="">Select a worker...</option>';
        workers.forEach(w => {
          const areaInfo = w.area ? ` (${w.area})` : '';
          workerOptions += `<option value="${w.id}">${w.full_name}${areaInfo}</option>`;
        });

        let beforeImgUrl = report.before_photo_url;
        if (beforeImgUrl) {
          const path = beforeImgUrl.split('/').pop();
          const { data: bData } = await supabaseClient.storage.from('reports-before').createSignedUrl(path, 3600);
          if (bData) beforeImgUrl = bData.signedUrl;
        }

        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div class="report-header">
            <h3>Issue: ${report.issue_type}</h3>
            <span class="badge badge-submitted">${report.status}</span>
          </div>
          <div class="report-content">
            <img src="${beforeImgUrl}" class="report-image" alt="Waste Issue">
            <div class="report-details">
              <p><strong>Reported By:</strong> ${report.profiles.full_name} (${report.profiles.phone || 'N/A'})</p>
              <p><strong>Date:</strong> ${date}</p>
              <p><strong>Location:</strong> ${report.address}</p>
              <div id="map-${report.id}" style="height: 200px; width: 100%; margin: 10px 0; border-radius: var(--radius-md); z-index: 1;"></div>
              <p><strong>Description:</strong> ${report.description || 'No description provided'}</p>
              
              <div style="margin-top: 1rem; padding: 1rem; background: var(--bg-light); border-radius: var(--radius-md);">
                <h4>Assign & Verify</h4>
                <select id="worker-${report.id}" style="width: 100%; padding: 0.5rem; margin: 0.5rem 0; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                  ${workerOptions}
                </select>
                <div class="report-actions">
                  <button class="btn btn-primary" onclick="verifyAndAssign('${report.id}')">Approve & Assign</button>
                  <button class="btn btn-outline" style="color: #EF4444; border-color: #EF4444;" onclick="rejectReport('${report.id}')">Reject</button>
                </div>
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);

        // Initialize Map for this report
        setTimeout(() => {
          const map = L.map(`map-${report.id}`).setView([report.latitude, report.longitude], 16);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
          }).addTo(map);
          L.marker([report.latitude, report.longitude]).addTo(map).bindPopup('Reported Location');
        }, 100);
      }
    }

    window.verifyAndAssign = async (reportId) => {
      const workerId = document.getElementById(`worker-${reportId}`).value;
      if (!workerId) {
        showToast('Please select a worker to assign.', 'error');
        return;
      }

      try {
        const { error: reportError } = await supabaseClient
          .from('reports')
          .update({ 
            status: 'Assigned', 
            assigned_worker_id: workerId 
          })
          .eq('id', reportId);

        if (reportError) throw reportError;

        await supabaseClient.from('status_history').insert([{
          report_id: reportId,
          status: 'Assigned',
          changed_by: currentUser.id,
          note: `Verified and assigned to worker.`
        }]);

        showToast('Report assigned successfully!', 'success');
        fetchPendingReports();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };

    window.rejectReport = async (reportId) => {
      const reason = prompt('Please enter a reason for rejection:');
      if (reason === null) return;

      try {
        const { error: reportError } = await supabaseClient
          .from('reports')
          .update({ 
            status: 'Rejected', 
            rejection_reason: reason || 'No reason provided'
          })
          .eq('id', reportId);

        if (reportError) throw reportError;

        await supabaseClient.from('status_history').insert([{
          report_id: reportId,
          status: 'Rejected',
          changed_by: currentUser.id,
          note: `Rejected: ${reason}`
        }]);

        showToast('Report rejected.', 'info');
        fetchPendingReports();
      } catch (error) {
        showToast(error.message, 'error');
      }
    };
  </script>
</body>
</html>
