<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 10% 20%, rgb(14, 21, 37) 0%, rgb(15, 23, 42) 90%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #f8fafc;
    }
    .navbar {
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
    }
    .logo {
      color: #10b981;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .admin-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }
    .avatar-icon {
      background: rgba(16, 185, 129, 0.1);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 2rem;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .admin-card h2 {
      font-weight: 700;
      font-size: 1.75rem;
      color: #ffffff;
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.025em;
    }
    .admin-card p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin: 0 0 2.5rem 0;
    }
    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-control {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.875rem 1rem;
      border-radius: 10px;
      color: #ffffff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    .form-control::placeholder {
      color: #475569;
    }
    .form-control:focus {
      outline: none;
      background: rgba(15, 23, 42, 0.8);
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      padding: 1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      width: 100%;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo">
      ♻️ CleanSetu <span style="font-size: 1rem; color: #64748b; font-weight: 500;">| Administrator</span>
    </a>
  </nav>

  <div class="login-wrapper">
    <div class="admin-card">
      <div class="avatar-icon">👑</div>
      <h2>System Access</h2>
      <p>Enter your credentials to enter the control panel.</p>
      
      <form id="admin-login-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="login-email" class="form-control" required placeholder="admin@cleansetu.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" id="login-btn" class="btn-login">Authenticate</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module">
    import { supabaseClient } from '../js/supabaseClient.js';
    
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (authError) throw authError;

        if (authData.user) {
          const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('role')
            .eq('id', authData.user.id)
            .single();

          if (profileError) throw profileError;
          
          if (profile.role !== 'Admin') {
            await supabaseClient.auth.signOut();
            throw new Error('Access denied. You are not an Admin.');
          }

          window.showToast('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = '/Admin/dashboard.html';
          }, 1000);
        }
      } catch (error) {
        window.showToast(error.message || 'Login failed', 'error');
      } finally {
        btn.textContent = 'Login to Dashboard';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
