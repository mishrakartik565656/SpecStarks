<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CleanSetu</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/landing.css">
</head>
<body>
  <nav class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">♻️ CleanSetu <span style="font-size: 1rem; color: var(--text-muted);">| Admin Secure Portal</span></a>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="card" style="max-width: 400px; margin: 2rem auto;">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: var(--primary);">Admin Login</h2>
        <form id="admin-login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" class="form-control" required placeholder="admin@cleansetu.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
          </div>
          <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
        </form>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module">
    import { supabaseClient } from '../js/supabaseClient.js';
    
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (authError) throw authError;

        if (authData.user) {
          const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('role')
            .eq('id', authData.user.id)
            .single();

          if (profileError) throw profileError;
          
          if (profile.role !== 'Admin') {
            await supabaseClient.auth.signOut();
            throw new Error('Access denied. You are not an Admin.');
          }

          window.showToast('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = '/Admin/dashboard.html';
          }, 1000);
        }
      } catch (error) {
        window.showToast(error.message || 'Login failed', 'error');
      } finally {
        btn.textContent = 'Login to Dashboard';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
