<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Waste - SwachhSaarthi</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    .report-container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--bg-white);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-family: inherit;
    }
    #map {
      height: 300px;
      width: 100%;
      border-radius: var(--radius-md);
      margin-top: 0.5rem;
      z-index: 1;
    }
    .photo-preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">♻️ SwachhSaarthi <span style="font-size: 1rem; color: var(--text-muted);">| Citizen</span></a>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="report.html" style="color: var(--primary);">Report Waste</a>
        <a href="my-complaints.html">My Complaints</a>
        <a href="pickup.html">Request Pickup</a>
        <a href="#" class="logout-btn btn btn-outline" style="padding: 0.5rem 1rem;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="report-container">
      <h2 style="margin-bottom: 1.5rem;">Report Waste Issue</h2>
      
      <form id="report-form">
        
        <div class="form-group">
          <label>Issue Type</label>
          <select id="issue_type" class="form-control" required>
            <option value="">Select an issue...</option>
            <option value="Overflowing Bin">Overflowing Bin</option>
            <option value="Garbage on Road">Garbage on Road</option>
            <option value="Illegal Dumping">Illegal Dumping</option>
            <option value="Missed Collection">Missed Collection</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Description (Optional)</label>
          <textarea id="description" class="form-control" rows="3" placeholder="Add more details about the issue..."></textarea>
        </div>

        <div class="form-group">
          <label>Photo Evidence</label>
          <div style="margin-bottom: 1rem;">
            <button type="button" class="btn btn-outline" id="btn-start-camera" style="width: 100%;">📷 Start Live Camera</button>
          </div>
          <div id="camera-container" style="display: none; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 1rem;">
            <video id="camera-video" autoplay playsinline style="width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radius-md); background: #000;"></video>
            <button type="button" class="btn btn-primary" id="btn-capture-photo">📸 Capture Photo</button>
          </div>
          <img id="photo-preview" class="photo-preview" alt="Preview">
        </div>

        <div class="form-group">
          <label>Location (Drag pin to adjust)</label>
          <button type="button" id="btn-locate" class="btn btn-outline" style="margin-bottom: 0.5rem;">
            📍 Use My Current Location
          </button>
          <div id="map"></div>
          <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.5rem;">
            Selected Coordinates: <span id="coords-display">Not set</span>
          </p>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          Submit Report
        </button>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module">
    import { supabaseClient } from '../js/supabaseClient.js';
    import { checkSession } from '../js/auth.js';

    let map;
    let marker;
    let lat = null;
    let lng = null;
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkSession(['Citizen']);
      if (!auth) return;
      currentUser = auth.session.user;

      console.log('CURRENT USER:', currentUser);
      console.log('USER ID:', currentUser.id);

      // Initialize map
      map = L.map('map').setView([28.6139, 77.2090], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Photo options
      document.getElementById('btn-start-camera').addEventListener('click', startCamera);
      document.getElementById('btn-capture-photo').addEventListener('click', capturePhoto);
      
      // Locate me button
      document.getElementById('btn-locate').addEventListener('click', getLocation);

      // Form submission
      document.getElementById('report-form').addEventListener('submit', handleSubmit);
      
      // Try to get location on load automatically
      getLocation();
    });

    function getLocation() {
      if (navigator.geolocation) {
        showToast('Getting location...', 'info');
        navigator.geolocation.getCurrentPosition(
          (position) => {
            lat = position.coords.latitude;
            lng = position.coords.longitude;
            updateMap(lat, lng);
            showToast('Location updated!', 'success');
          },
          (error) => {
            showToast('Could not get location. Please allow location access or move the pin manually.', 'error');
            updateMap(28.6139, 77.2090);
          },
          { enableHighAccuracy: true }
        );
      } else {
        showToast('Geolocation is not supported by your browser.', 'error');
        updateMap(28.6139, 77.2090);
      }
    }

    function updateMap(latitude, longitude) {
      lat = latitude;
      lng = longitude;
      map.setView([lat, lng], 15);
      
      if (marker) {
        marker.setLatLng([lat, lng]);
      } else {
        marker = L.marker([lat, lng], { draggable: true }).addTo(map);
        marker.on('dragend', function(e) {
          const position = marker.getLatLng();
          lat = position.lat;
          lng = position.lng;
          document.getElementById('coords-display').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        });
      }
      document.getElementById('coords-display').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    }



    let compressedImageBlob = null;
    let stream = null;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const video = document.getElementById('camera-video');
        video.srcObject = stream;
        document.getElementById('camera-container').style.display = 'flex';
        document.getElementById('photo-preview').style.display = 'none';
      } catch (err) {
        showToast('Camera access denied or unavailable.', 'error');
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      document.getElementById('camera-container').style.display = 'none';
    }

    function capturePhoto() {
      const video = document.getElementById('camera-video');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Compress similar to file upload
      const MAX_WIDTH = 1000;
      let width = canvas.width;
      let height = canvas.height;
      if (width > MAX_WIDTH) {
        height *= MAX_WIDTH / width;
        width = MAX_WIDTH;
      }

      const compressCanvas = document.createElement('canvas');
      compressCanvas.width = width;
      compressCanvas.height = height;
      const compressCtx = compressCanvas.getContext('2d');
      compressCtx.drawImage(canvas, 0, 0, width, height);

      compressCanvas.toBlob((blob) => {
        compressedImageBlob = blob;
        const preview = document.getElementById('photo-preview');
        preview.src = URL.createObjectURL(blob);
        preview.style.display = 'block';
        stopCamera();
        showToast('Photo captured!', 'success');
      }, 'image/jpeg', 0.8);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      
      if (!lat || !lng) {
        showToast('Please set the location on the map.', 'error');
        return;
      }
      
      if (!compressedImageBlob) {
        showToast('Please upload a valid photo.', 'error');
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Submitting...';
      btn.disabled = true;

      try {
        // 1. Upload photo to Supabase Storage
        const fileExt = 'jpg';
        const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;
        const filePath = `${fileName}`;

        console.log('AUTH USER BEFORE UPLOAD:', currentUser?.id);
        const { error: uploadError, data: uploadData } = await supabaseClient.storage
          .from('reports-before')
          .upload(filePath, compressedImageBlob, { contentType: 'image/jpeg' });

        if (uploadError) throw uploadError;

        // Get public URL
        const { data: { publicUrl } } = supabaseClient.storage
          .from('reports-before')
          .getPublicUrl(filePath);

        // 2. Insert record into reports table
        const issueType = document.getElementById('issue_type').value;
        const description = document.getElementById('description').value;
        const address = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;

        const { data: reportData, error: reportError } = await supabaseClient
          .from('reports')
          .insert([{
            citizen_id: currentUser.id,
            issue_type: issueType,
            description: description,
            before_photo_url: publicUrl,
            latitude: lat,
            longitude: lng,
            address: address,
            status: 'Submitted'
          }])
          .select();

        if (reportError) throw reportError;
        
        // 3. Insert into status history
        const reportId = reportData[0].id;
        await supabaseClient.from('status_history').insert([{
          report_id: reportId,
          status: 'Submitted',
          changed_by: currentUser.id,
          note: 'Report initially submitted.'
        }]);

        showToast('Report submitted successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'my-complaints.html';
        }, 2000);

      } catch (error) {
        console.error(error);
        showToast(error.message || 'Error submitting report', 'error');
        btn.textContent = 'Submit Report';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
